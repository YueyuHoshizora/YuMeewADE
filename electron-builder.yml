# Default artifacts are ad-hoc/unsigned. CI opts into official signing only with complete external credentials.
appId: dev.yueyuhoshizora.yumeewade
productName: YuMeewADE
copyright: Copyright © 2026 Yueyu Hoshizora. GPL-3.0-only.
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - templates/**
  - config.yaml
  - package.json
  - LICENSE
  - "!node_modules/node-pty/prebuilds/**/*.pdb"
extraResources:
  - from: build/icon.png
    to: icon.png
asar: true
asarUnpack:
  - node_modules/node-pty/**
npmRebuild: false
mac:
  icon: build/icon.png
  binaries:
    - Contents/Resources/app.asar.unpacked/node_modules/node-pty/prebuilds/darwin-arm64/spawn-helper
    - Contents/Resources/app.asar.unpacked/node_modules/node-pty/prebuilds/darwin-x64/spawn-helper
  category: public.app-category.developer-tools
  target: [dmg, zip]
  # ad-hoc 簽名：Apple 晶片要求整個 bundle 簽章有效；identity: null 會留下打包後失效的 Electron 簽章，
  # 從網路下載（帶 quarantine）後 Gatekeeper 會直接判定「已毀損」且無法放行。
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
win:
  icon: build/icon.png
  target: [nsis, portable]
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  icon: build/icon.png
  target: [AppImage, deb]
  category: Development
  maintainer: yueyuhoshizora@gmail.com

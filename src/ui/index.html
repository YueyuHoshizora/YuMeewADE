<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YuMeewADE</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <aside id="projects" class="col">
        <header><h1>YuMeewADE</h1><span id="version" class="muted"></span></header>
        <div class="toolbar">
          <input id="project-name" data-i18n-placeholder="app.newProjectPlaceholder" maxlength="64" />
          <button id="project-create" data-i18n="app.createProject"></button>
        </div>
        <ul id="project-list" class="list"></ul>
        <div class="toolbar">
          <label for="language" class="muted small" data-i18n="app.language"></label>
          <select id="language"></select>
        </div>
        <footer class="muted" id="workspace-root"></footer>
      </aside>
      <section id="tasks" class="col">
        <header><h2 id="tasks-title" data-i18n="app.tasks"></h2></header>
        <div class="toolbar">
          <input id="task-title" data-i18n-placeholder="app.newTaskPlaceholder" maxlength="200" />
          <select id="task-role"></select>
          <button id="task-create" data-i18n="app.createTask"></button>
        </div>
        <ul id="task-list" class="list"></ul>
      </section>
      <main id="chat" class="col">
        <header id="chat-header" class="hidden">
          <div class="row">
            <h2 id="chat-title"></h2>
            <select id="task-state"></select>
            <span id="task-steps" class="muted"></span>
          </div>
          <div class="row muted small">
            <span id="task-meta"></span>
          </div>
          <div id="task-question" class="question hidden"></div>
          <div id="worktree" class="row small"></div>
        </header>
        <div id="chat-empty" class="empty" data-i18n="app.selectTask"></div>
        <div id="chat-log" class="log hidden"></div>
        <div id="queue" class="queue hidden"></div>
        <form id="composer" class="composer hidden">
          <textarea id="composer-text" rows="3" data-i18n-placeholder="app.composerPlaceholder"></textarea>
          <div class="row">
            <select id="composer-cli"></select>
            <select id="composer-model"></select>
            <select id="composer-effort">
              <option value="" data-i18n="app.effortDefault"></option>
              <option value="low">low</option>
              <option value="medium">medium</option>
              <option value="high">high</option>
              <option value="xhigh">xhigh</option>
            </select>
            <span class="spacer"></span>
            <button type="button" id="composer-stop" class="danger" disabled data-i18n="app.stop"></button>
            <button type="submit" id="composer-send" data-i18n="app.send"></button>
          </div>
          <div id="status" class="muted small"></div>
        </form>
      </main>
    </div>
    <div id="toast" class="toast hidden"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

# YuMeewADE 設定檔範本
# 讀取順序：環境變數 YUMEEWADE_CONFIG 指向的檔案 → 目前目錄的 config.yaml → ~/.yumeewade/config.yaml → 內建預設值（與本檔相同）。
# 桌面 App 第一次啟動時會把本範本複製到使用者設定目錄（macOS: ~/Library/Application Support/yumeewade/config.yaml）。
# 所有值皆可改；程式不寫死任何 host／port／路徑／CLI 旗標。

server:
  host: 127.0.0.1          # 只允許 loopback（127.0.0.1 或 localhost）；改成 0.0.0.0 會被拒絕啟動
  port: 4560

workspace:
  root: ~/Documents/YuMeewWorkspace   # 台帳與工作副本的根目錄；~ 會展開
  # 結構：
  #   {root}/roles.yaml                        角色分工（不存在時自動從範本建立）
  #   {root}/Projects/{專案}/PROJECT.md        專案台帳
  #   {root}/Projects/{專案}/.ai/tasks/*.md    作業台帳
  #   {root}/Projects/{專案}/.ai/chat/*        對話記錄（jsonl）、session（json）、隊列（queue.json）
  #   {root}/Work/{專案}/{作業ID}/             git worktree 工作副本
  #   {root}/.yumeewade/                       操作紀錄、設定、模型清單快取、內部日誌

cli:
  claude:
    command: claude
    # 無頭模式必要旗標；adapter 依 stream-json 解析，移除這些旗標會使對話無法運作。
    baseArgs: [-p, --output-format, stream-json, --verbose, --include-partial-messages]
    # ⚠ 預設跳過所有權限確認：AI 可以用你的帳號權限改檔與執行任何指令。
    # 設定頁可逐一關閉（存在 .yumeewade/settings.json，優先於這裡）；關閉時改用 safeArgs。
    fullAccess: true
    fullAccessArgs: [--dangerously-skip-permissions]
    safeArgs: [--permission-mode, manual]  # 需要核准時透過聊天卡片詢問
    approvalArgs: [--input-format, stream-json, --permission-prompt-tool, stdio]
    # Review is independent of fullAccess. Verified restricted tool allowlist only; not an OS sandbox.
    # Empty/modified unverified profiles disable review rather than weaken it.
    readonlyArgs: [--restricted, --safe-mode, --tools, 'Read,Glob,Grep', --allowedTools, 'Read,Glob,Grep', --permission-mode, dontAsk, --permission-prompts, none, --strict-mcp-config, --disable-slash-commands, --no-session-persistence, -p, --output-format, stream-json, --verbose, --include-partial-messages]
    authRefreshArgs: [-p, /usage, --output-format, json]  # 存取權杖過期時讓 CLI 換發（唯讀，不啟動模型回合）
    loginArgs: [auth, login]                          # 新增帳號時的 OAuth 登入子命令
    mcpListArgs: [mcp, list]
    mcpAddArgs: [mcp, add, --scope, user]
    mcpRemoveArgs: [mcp, remove, --scope, user]
  codex:
    command: codex
    # Separate stdio JSON-RPC lifecycle (Codex 0.162.1); use exec explicitly for legacy JSONL.
    mode: app-server
    appServerArgs: [app-server, --stdio, -c, 'cli_auth_credentials_store="file"']
    # app-server safe mode uses on-request approvals and workspace-write; fullAccess remains explicit.
    baseArgs: [exec, --json, --skip-git-repo-check]
    # ⚠ 預設跳過權限確認與沙箱。
    fullAccess: true
    fullAccessArgs: [--dangerously-bypass-approvals-and-sandbox]
    safeArgs: [-s, workspace-write, -c, 'approval_policy="never"']   # 工作目錄沙箱內可改檔與執行指令
    # Native read-only sandbox; fresh ephemeral session, no user config/rules.
    readonlyArgs: [exec, --json, --skip-git-repo-check, --sandbox, read-only, -c, 'approval_policy="never"', --ignore-user-config, --ignore-rules, --ephemeral]
    # 查帳號即時額度用的子命令（app-server：與 CLI 同一份後端資料）；留空則只讀本機紀錄的最後一筆。
    quotaArgs: [app-server]
    loginArgs: [login, -c, 'cli_auth_credentials_store="file"']   # 登入結果寫入 CODEX_HOME/auth.json 供匯入
    mcpListArgs: [mcp, list, --json]
    mcpAddArgs: [mcp, add]
    mcpRemoveArgs: [mcp, remove]
  grok:
    command: grok
    # Grok Build 原生 ACP JSONL 更新，保留完整／不完整 token 用量的區別。
    baseArgs: [--output-format, streaming-json]
    fullAccess: true
    fullAccessArgs: [--always-approve]
    safeArgs: [--permission-mode, dontAsk]  # 需核准的操作直接拒絕，不等待互動
    readonlyArgs: []                     # Review refused: protection not verified
    quotaArgs: []                         # 額度直接向 Grok API 查詢，不啟動子命令
    authRefreshArgs: [models]             # 存取權杖過期時讓 CLI 換發
    loginArgs: [login, --oauth]
    mcpListArgs: [mcp, list, --json]
    mcpAddArgs: [mcp, add, --scope, user]
    mcpRemoveArgs: [mcp, remove, --scope, user]
  gemini:
    command: agy                          # Google Antigravity CLI（Gemini 的官方後繼）；沿用 CLI 自己的登入
    # 提示以 stream-json 的 user 訊息經 stdin 傳入，不出現在 argv。
    baseArgs: [--output-format, stream-json, --input-format, stream-json, --print=]
    fullAccess: true
    fullAccessArgs: [--dangerously-skip-permissions]
    safeArgs: [--mode, accept-edits]      # 只自動接受檔案編輯
    readonlyArgs: []                     # Plan/terminal restrictions do not prove filesystem read-only
    quotaArgs: [-p, /usage, --output-format, json]  # 唯讀額度報告，不啟動模型回合
    loginArgs: []
    commandsArgs: [-p, /help, --output-format, json]  # CLI 回報可用的唯讀 slash 命令
    slashArgs: [--output-format, json, --print]       # 獨立執行，不混入對話提示
    mcpListArgs: [mcp, list]
    mcpAddArgs: [mcp, add]
    mcpRemoveArgs: [mcp, remove]
  # 子行程環境變數採白名單；除了內建的 PATH／HOME／LANG 等基本變數外，額外要放行的名稱寫在這裡
  envPassthrough: []

# 外部工具使用 argv（不經 shell）；{cwd}／{url} 替換成目前副本路徑／經驗證的網址。
# terminal 不設定時使用系統終端。IDE／debug browser 要設定本機已安裝的程式。
execution: {}
#  ide: { command: code, args: ['{cwd}'] }
#  browser: { command: chromium, args: ['{url}'] }

update:
  enabled: true                    # 定時檢查 GitHub 發行頁有沒有新版本（只通知，不自動安裝）
  repo: YueyuHoshizora/YuMeewADE   # 擁有者/倉庫
  checkHours: 6                    # 檢查間隔（小時）

limits:
  bodyBytes: 2097152       # JSON 請求體上限（2 MiB）
  promptChars: 100000      # 單則指示字數上限
  mentionFileBytes: 65536   # @檔案每檔讀取上限（64 KiB）
  mentionTotalBytes: 262144 # @檔案每次指示總讀取上限（256 KiB）
  sendPerMinute: 30        # 每來源每分鐘可送出的指示數
  concurrentRuns: 3        # 同時執行中的對話數
  sseConnections: 30       # SSE 連線數上限
  queueLength: 20          # 每個作業的排隊指示上限
  handoffChars: 60000      # 換 AI 交接包字數上限（超長截舊留新）
  heartbeatSeconds: 15     # SSE 心跳間隔
  diffBytes: 2000000       # 合併前 diff 顯示上限
  uploadBytes: 20971520    # 單張圖片上限（20 MiB）
  imagesPerSend: 10        # 每次送出最多幾張圖片
  verifySeconds: 600       # 驗證指令逾時秒數
  verifyOutputBytes: 65536 # 驗證 stdout/stderr 合計保留尾端位元組
  runSeconds: 7200         # 單輪 AI 執行時間上限（秒），超過就停止，避免卡住的行程佔著名額
  approvalSeconds: 120     # 工具核准等待上限；逾時拒絕
  usagePollSeconds: 60     # 底部額度向各 CLI 重新查詢的間隔（秒）

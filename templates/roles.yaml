# 角色分工（所有專案共用；缺檔時由 YuMeewADE 自動建立）
# 槽位：[cli, model, effort] 或 [人]；effort 使用 CLI 原值 low/medium/high/xhigh/max。
# backup 是人工換手候選；權限由設定頁逐一設定，不由角色決定。
roles:
  規劃: { main: [claude, claude-opus-5-5, high], job: 規劃、分工與進度管理 }
  實作: { main: [codex, gpt-6.1-sol, high], job: 程式開發 }
  審查: { main: [claude, claude-fable-5-1, high], job: 獨立審查（開發者仍須自行測試） }
  文件: { main: [claude, claude-sonnet-5-5, medium], job: 說明文件與手冊 }
  最終確認: { main: [人], job: 判斷是否完成 }

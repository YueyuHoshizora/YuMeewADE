# 角色分工（所有專案共用；缺檔時由 YuMeewADE 自動建立）
# 槽位格式：[cli, model, effort]
#   cli    = claude / codex / mock / 人（「人」代表不由 AI 執行）
#   model  = 該 CLI 可接受的模型名稱或別名（留 default 代表交給 CLI 預設）
#   effort = low / medium / high / xhigh
# backup 只是人工換手時的候選，不會自動切換。
# 危險旗標（跳過權限確認）不在這裡設定，一律看 config.yaml 的 cli.*.dangerous。

models:
  claude: [opus, sonnet, haiku]
  codex: [default, gpt-6-sol]

roles:
  規劃: { main: [claude, opus, high],   backup: [codex, default, high],   job: 規劃、分工與進度管理 }
  實作: { main: [codex, default, high], backup: [claude, sonnet, high],   job: 程式開發 }
  審查: { main: [claude, opus, xhigh],  backup: [codex, default, high],   job: 獨立審查（開發者仍須自行測試） }
  文件: { main: [claude, sonnet, medium], backup: [codex, default, medium], job: 說明文件與手冊 }
  最終確認: { main: [人], backup: [人], job: 判斷是否完成 }
